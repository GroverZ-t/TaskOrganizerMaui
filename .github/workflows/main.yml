name: Build MAUI iOS App Bundle

on: [push]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 🆕 НОВЫЙ ШАГ: Выбираем правильную версию Xcode
      - name: Select Xcode 16.0
        run: |
          echo "📱 Доступные версии Xcode:"
          ls -d /Applications/Xcode*.app
          
          # Выбираем Xcode 16.0 (или 16.1, если 16.0 нет)
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
            echo "✅ Выбран Xcode 16.0"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
            echo "✅ Выбран Xcode 16.1"
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
            echo "✅ Выбран Xcode 16"
          else
            echo "❌ Xcode 16 не найден, используем текущую версию"
          fi
          
          echo ""
          echo "Текущая версия Xcode:"
          xcodebuild -version

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build iOS App Bundle (Unsigned)
        run: |
          CSPROJ="TaskOrganizerMaui/TaskOrganizerMaui.csproj"
          
          echo "🔨 Building project: $CSPROJ"
          
          dotnet publish "$CSPROJ" \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=false \
            -p:ArchiveOnBuild=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false \
            -p:SkipCodesigning=true

      - name: Find and Zip .app Bundle
        run: |
          echo "🔍 Searching for .app bundle..."
          
          APP_DIR=$(find . -type d -name "*.app" -path "*/bin/*" 2>/dev/null | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "❌ ERROR: .app not found. Searching everywhere:"
            find . -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_DIR"
          
          mkdir -p output
          cp -R "$APP_DIR" output/TaskOrganizerMaui.app
          
          cd output
          zip -r TaskOrganizerMaui.ipa TaskOrganizerMaui.app
          cd ..
          
          echo "📦 Successfully created output/TaskOrganizerMaui.ipa"
          ls -la output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskOrganizerMaui-iOS-Build
          path: output/TaskOrganizerMaui.ipa
          retention-days: 7
